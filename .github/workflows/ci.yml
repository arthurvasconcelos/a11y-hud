name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (Node ${{ matrix.node-version }})
    # Release commits were already tested on the release PR; only the Release workflow needs to run on them.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release packages') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ["22", "24"]
    outputs:
      playwright-version: ${{ steps.playwright.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint + format check
        run: pnpm check:ci

      - name: Build core
        run: pnpm --filter=a11y-hud build

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm -r --filter='./packages/*' exec vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=test-report.junit.xml

      - name: Upload coverage to Codecov
        if: matrix.node-version == '24'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.node-version == '24' }}
        continue-on-error: true
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/test-report.junit.xml,packages/angular/test-report.junit.xml,packages/react/test-report.junit.xml,packages/vue/test-report.junit.xml,packages/svelte/test-report.junit.xml,packages/solid/test-report.junit.xml

      - name: Build packages
        run: pnpm build

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter=a11y-hud exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The official image ships every browser and its system libraries, so no
    # browser download and no apt install on the runner's Ubuntu mirror.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.ci.outputs.playwright-version }}-noble
      options: --ipc=host
    env:
      # Firefox refuses to launch when $HOME is not owned by the current user,
      # and the Actions container runs as root with HOME set to /github/home.
      HOME: /root

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: E2E tests
        run: pnpm test:e2e
