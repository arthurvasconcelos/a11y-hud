version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        patterns:
          - "@biomejs/*"
          - "@changesets/*"
          - "@commitlint/*"
          - "lint-staged"
          - "simple-git-hooks"
          - "typescript"
          - "tsup"
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "playwright"
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "ng-packagr"
    ignore:
      # tsup's declaration build (rollup-plugin-dts) needs the TypeScript
      # compiler API, which TypeScript 7 no longer ships.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
